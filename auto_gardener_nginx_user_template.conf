# Template generated from /Users/wangzy/Desktop/auto_gardener/deploy/gardener-relay.py
# Replace <user>, <publicPort>, <remotePort> before use.
server {
    listen <publicPort>;
    server_name _;

    client_max_body_size 200m;
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    auth_basic "Gardener";
    auth_basic_user_file /etc/gardener-relay/users/<user>/htpasswd;

    location / {
        proxy_pass http://127.0.0.1:<remotePort>;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
